name: TikTok to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Install FFmpeg and yt-dlp Nightly
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install -U --pre "yt-dlp[default,curl-cffi]"

      - name: Show yt-dlp version
        run: |
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Test TikTok LIVE
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
        run: |
          echo "Testing TikTok LIVE..."

          yt-dlp \
            --verbose \
            --no-playlist \
            "$TIKTOK_URL" \
            -F

      - name: Start TikTok to YouTube
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |

          while true
          do

            echo "========================================"
            echo "Getting TikTok LIVE stream..."
            echo "========================================"

            yt-dlp \
              --no-playlist \
              --retries infinite \
              --fragment-retries infinite \
              --retry-sleep 2 \
              -f "best" \
              -g \
              "$TIKTOK_URL" > stream_url.txt

            if [ ! -s stream_url.txt ]; then
              echo "No TikTok stream URL obtained."
              echo "Retrying in 20 seconds..."
              sleep 20
              continue
            fi

            STREAM_URL=$(head -n 1 stream_url.txt)

            echo "Stream URL obtained."
            echo "Starting FFmpeg..."

            ffmpeg \
              -hide_banner \
              -loglevel info \
              -re \
              -rw_timeout 60000000 \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 15 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36" \
              -i "$STREAM_URL" \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -b:v 4500k \
              -maxrate 4500k \
              -bufsize 9000k \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -sc_threshold 0 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -f flv \
              "rtmps://a.rtmps.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

            echo "========================================"
            echo "FFmpeg stopped."
            echo "Refreshing TikTok stream..."
            echo "========================================"

            sleep 10

          done
