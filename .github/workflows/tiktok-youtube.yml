name: TikTok to YouTube Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install -U yt-dlp

      - name: Check TikTok LIVE
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
        run: |
          echo "Checking TikTok LIVE..."

          yt-dlp \
            --no-playlist \
            --get-title \
            "$TIKTOK_URL" || true

      - name: Get TikTok Stream URL
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
        run: |
          echo "Getting TikTok stream URL..."

          yt-dlp \
            --no-playlist \
            -f "best" \
            -g \
            "$TIKTOK_URL" > stream_url.txt

          if [ ! -s stream_url.txt ]; then
            echo "ERROR: TikTok stream URL was not obtained."
            exit 1
          fi

          echo "TikTok stream URL obtained successfully."

      - name: Start YouTube Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          STREAM_URL=$(head -n 1 stream_url.txt)

          echo "Starting YouTube Live..."

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -i "$STREAM_URL" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmps://a.rtmps.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
