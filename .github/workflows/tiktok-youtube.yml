      - name: TikTok to YouTube with Auto Retry
        env:
          TIKTOK_URL: ${{ secrets.TIKTOK_URL }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          while true; do

            echo "======================================"
            echo "Getting fresh TikTok LIVE stream URL..."
            echo "======================================"

            STREAM_URL=$(yt-dlp \
              --no-playlist \
              -f "best" \
              -g \
              "$TIKTOK_URL" 2>/dev/null | head -n 1)

            if [ -z "$STREAM_URL" ]; then
              echo "TikTok stream URL not available."
              echo "Retrying in 20 seconds..."
              sleep 20
              continue
            fi

            echo "Fresh stream URL obtained."
            echo "Starting YouTube LIVE..."

            ffmpeg \
              -hide_banner \
              -loglevel info \
              -re \
              -rw_timeout 60000000 \
              -reconnect 1 \
              -reconnect_at_eof 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 15 \
              -user_agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36" \
              -http_persistent 1 \
              -i "$STREAM_URL" \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -b:v 4500k \
              -maxrate 4500k \
              -bufsize 9000k \
              -r 30 \
              -g 60 \
              -keyint_min 60 \
              -sc_threshold 0 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -f flv \
              "rtmps://a.rtmps.youtube.com/live2/${YOUTUBE_STREAM_KEY}"

            echo "FFmpeg stopped."
            echo "Getting a completely fresh TikTok URL..."
            sleep 10

          done
